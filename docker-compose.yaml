version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: rails_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rails_development
      MYSQL_USER: rails_user
      MYSQL_PASSWORD: rails_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rails_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: rails_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rails_network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: rails_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rails_network

  # Rails Application
  rails:
    build: .
    container_name: rails_app
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
      - DATABASE_HOST=mysql
      - DATABASE_NAME=rails_development
      - DATABASE_USER=rails_user
      - DATABASE_PASSWORD=rails_password
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: >
      sh -c "
        bundle install &&
        rails db:drop db:create db:schema:load db:seed &&
        rails server -b 0.0.0.0
      "
    stdin_open: true
    tty: true
    networks:
      - rails_network

  # Sidekiq Background Jobs
  sidekiq:
    build: .
    container_name: rails_sidekiq
    environment:
      - RAILS_ENV=development
      - DATABASE_HOST=mysql
      - DATABASE_NAME=rails_development
      - DATABASE_USER=rails_user
      - DATABASE_PASSWORD=rails_password
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rails:
        condition: service_started
    command: >
      sh -c "
        bundle install &&
        bundle exec sidekiq
      "
    networks:
      - rails_network

volumes:
  mysql_data:
  redis_data:
  elasticsearch_data:
  bundle_cache:

networks:
  rails_network:
    driver: bridge